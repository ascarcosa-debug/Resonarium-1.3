const $=id=>document.getElementById(id),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),enc=new TextEncoder();
let fails=0;
async function derive(pw){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['decrypt'])}
async function plain(key){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.i)},key,b64(D.c));return new TextDecoder().decode(p)}
function show(t){document.open();document.write(t);document.close()}
async function tryPw(){const pw=$('pw').value;if(!pw)return;$('err').textContent='Verificando…';
 try{const key=await derive(pw),t=await plain(key);
  if($('rem').checked){try{localStorage.setItem('rk',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))))}catch(e){}}
  show(t)}
 catch(e){fails++;await new Promise(r=>setTimeout(r,Math.min(4000,700*fails)));$('err').textContent='Código incorrecto. Inténtalo de nuevo.';$('pw').select()}}
$('go').onclick=tryPw;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw()});
(async()=>{try{const r=localStorage.getItem('rk');if(r){const key=await crypto.subtle.importKey('raw',b64(r),'AES-GCM',true,['decrypt']);show(await plain(key))}}catch(e){try{localStorage.removeItem('rk')}catch(_){}}})();
